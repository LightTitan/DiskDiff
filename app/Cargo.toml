[package]
name = "diskdiff"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
diskdiff-engine = { path = "../engine" }
diskdiff-ipc = { path = "../ipc" }
diskdiff-cli = { path = "../cli" }
gpui-kit = "0.8.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["test-support"] }
image = { version = "0.25.1", default-features = false, features = ["png"] }
anyhow = "1"
dirs = "6"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# Embeds the icon into diskdiff.exe (see build.rs). Matched against the
# machine doing the build, like build.rs's own cfg.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# The Linux .deb, built by `cargo deb -p diskdiff --no-build` in the release
# workflow after both binaries are built.
[package.metadata.deb]
name = "diskdiff"
maintainer = "LightTitan <100202261+LightTitan@users.noreply.github.com>"
copyright = "DiskDiff contributors"
license-file = ["../LICENSE", "0"]
extended-description = """\
DiskDiff scans your disk over time and shows what changed between scans: \
which folders grew, what was added, moved or deleted, and where your free \
space went. Includes diskdiff-cli, a command-line tool and MCP server that lets AI \
agents read your scan history."""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/diskdiff", "usr/bin/", "755"],
    ["target/release/diskdiff-cli", "usr/bin/", "755"],
    ["../packaging/linux/diskdiff.desktop", "usr/share/applications/", "644"],
    ["../packaging/linux/diskdiff.png", "usr/share/icons/hicolor/512x512/apps/diskdiff.png", "644"],
]
