name: Release

# Builds DiskDiff for macOS as one universal app (Apple silicon and Intel) and
# attaches the DMG to a draft GitHub release. Runs when a version tag (v*) is
# pushed, or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: GPUI compiles its Metal shaders with `xcrun metal`, which newer
    # Xcode versions no longer install by default.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($version)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2

      - run: ./build.sh --universal --dmg

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DiskDiff v${{ steps.version.outputs.version }}
          body: See the assets below to download DiskDiff.
          draft: true
          files: target/DiskDiff_${{ steps.version.outputs.version }}_universal.dmg
          fail_on_unmatched_files: true
