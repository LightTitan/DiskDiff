name: Release

# Builds DiskDiff for macOS (a DMG with one universal app for Apple silicon
# and Intel), Windows (a per-user setup.exe) and Linux (an AppImage and a
# .deb), and attaches them to one draft GitHub release. Runs when a version tag (v*) is pushed, or manually.
#
# The build jobs only upload workflow artifacts; a single last job creates
# the draft and attaches everything, so parallel jobs never race to create
# the release (draft releases have no tag yet, so separate uploads could
# each create their own draft).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($version)"
            exit 1
          fi

  macos:
    needs: version
    # Pinned: GPUI compiles its Metal shaders with `xcrun metal`, which newer
    # Xcode versions no longer install by default.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2

      # Builds DiskDiff.app with diskdiff-mcp inside, and the DMG.
      - run: ./build.sh --universal --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/DiskDiff_${{ needs.version.outputs.version }}_universal.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: cargo build --release --locked -p diskdiff -p diskdiff-mcp

      - name: Build the installer
        shell: pwsh
        run: |
          # NSIS (the tool behind most Windows setup programs); install it if
          # the runner image doesn't have it.
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
          }
          $version = "${{ needs.version.outputs.version }}"
          & $nsis /V3 "/DVERSION=$version" "/DSRC=$PWD\target\release" `
            "/DOUT=$PWD\target\DiskDiff_${version}_x64-setup.exe" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/DiskDiff_${{ needs.version.outputs.version }}_x64-setup.exe
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libvulkan-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: cargo build --release --locked -p diskdiff -p diskdiff-mcp

      - name: Build the .deb
        run: |
          cargo install cargo-deb --locked --version 3.7.0
          cargo deb -p diskdiff --no-build \
            --output "target/DiskDiff_${{ needs.version.outputs.version }}_amd64.deb"

      - name: Build the AppImage
        run: |
          app=target/AppDir
          install -Dm755 target/release/diskdiff "$app/usr/bin/diskdiff"
          install -Dm755 target/release/diskdiff-mcp "$app/usr/bin/diskdiff-mcp"
          strip "$app/usr/bin/diskdiff" "$app/usr/bin/diskdiff-mcp"
          install -Dm755 packaging/linux/AppRun "$app/AppRun"
          install -Dm644 packaging/linux/diskdiff.desktop "$app/diskdiff.desktop"
          install -Dm644 packaging/linux/diskdiff.png "$app/diskdiff.png"
          install -Dm644 packaging/linux/diskdiff.desktop "$app/usr/share/applications/diskdiff.desktop"
          install -Dm644 packaging/linux/diskdiff.png "$app/usr/share/icons/hicolor/512x512/apps/diskdiff.png"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # The runner has no FUSE: let the tool unpack itself instead of mounting.
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$app" \
            "target/DiskDiff_${{ needs.version.outputs.version }}_amd64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/DiskDiff_${{ needs.version.outputs.version }}_amd64.deb
            target/DiskDiff_${{ needs.version.outputs.version }}_amd64.AppImage
          if-no-files-found: error

  release:
    needs: [version, macos, windows, linux]
    # The Windows and Linux builds are new: a failure there still drafts the
    # release with what did build, as long as the macOS DMG is there. The
    # failed job shows red in the run, so a missing file doesn't go unnoticed.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DiskDiff v${{ needs.version.outputs.version }}
          body: |
            See the assets below to download DiskDiff.

            | Download | Status |
            |---|---|
            | `DiskDiff_${{ needs.version.outputs.version }}_universal.dmg` (macOS) | Tested |
            | `DiskDiff_${{ needs.version.outputs.version }}_x64-setup.exe` (Windows installer) | **Untested**: built automatically but not yet tried on a real PC |
            | `DiskDiff_${{ needs.version.outputs.version }}_amd64.AppImage` (Linux, any distribution) | **Untested**: built automatically but not yet tried on a real PC |
            | `DiskDiff_${{ needs.version.outputs.version }}_amd64.deb` (Ubuntu, Debian) | **Untested**: built automatically but not yet tried on a real PC |

            Windows and Linux support is new. Please report anything that doesn't work in an issue.
          draft: true
          files: |
            dist/DiskDiff_${{ needs.version.outputs.version }}_universal.dmg
            dist/DiskDiff_${{ needs.version.outputs.version }}_x64-setup.exe
            dist/DiskDiff_${{ needs.version.outputs.version }}_amd64.AppImage
            dist/DiskDiff_${{ needs.version.outputs.version }}_amd64.deb
          fail_on_unmatched_files: false
